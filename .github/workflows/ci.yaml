name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成配置文件
        run: cp .env.example .env

      - name: 启动 mock 接口服务
        run: |
          python mock_api.py &
          sleep 2

      - name: 运行测试并生成报告
        run: python -m pytest --html=report/report.html --self-contained-html

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: report/
